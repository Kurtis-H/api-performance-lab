[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "api-performance-lab"
version = "0.1.0"
description = "A booking API with switchable performance problems, plus the API and load tests that catch them."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Kurtis" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "psycopg[binary]>=3.2",
    "prometheus-client>=0.20",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "httpx>=0.27",
    "schemathesis>=4.0",
    "pact-python>=3",
    "hypothesis>=6.100",
    "mypy>=1.10",
    "ruff>=0.5",
    "pip-audit>=2.7",
]

[tool.setuptools.packages.find]
include = ["app*", "perf*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "catches_n_plus_one: fails when PERF_BUGS includes n_plus_one",
    "catches_missing_index: fails when PERF_BUGS includes missing_index",
    "catches_memory_leak: fails when PERF_BUGS includes memory_leak",
    "catches_no_page_limit: fails when PERF_BUGS includes no_page_limit",
    "catches_race: fails when PERF_BUGS includes race",
    "catches_cache_stampede: fails when PERF_BUGS includes cache_stampede",
    "catches_hold_race: fails when PERF_BUGS includes hold_race",
    "catches_oversell: fails when PERF_BUGS includes oversell",
    "catches_promo_race: fails when PERF_BUGS includes promo_race",
]
filterwarnings = ["ignore::DeprecationWarning:schemathesis.*"]

[tool.coverage.run]
source = ["app", "perf"]
omit = ["app/seed.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101", "S311"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"app/seed.py" = ["S105"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
files = ["app", "perf"]
